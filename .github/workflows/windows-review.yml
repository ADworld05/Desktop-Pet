name: Manual Windows review build
on:
  workflow_dispatch:
    inputs:
      godot:
        description: Godot 4.7.2 Standard executable on the runner
        required: true
        type: string
      cc:
        description: x86_64 MinGW-w64 gcc executable on the runner
        required: true
        type: string
      templates:
        description: Matching 4.7.2 export-template directory on the runner
        required: true
        type: string
permissions:
  contents: read
jobs:
  build:
    # Manual only. Provision a dedicated trusted runner before use.
    runs-on: [self-hosted, Windows, X64, desktop-pet-build]
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - name: Check source and build portable plus setup
        shell: pwsh
        env:
          DP_GODOT: ${{ inputs.godot }}
          DP_CC: ${{ inputs.cc }}
          DP_TEMPLATES: ${{ inputs.templates }}
        run: |
          $ErrorActionPreference = 'Stop'
          python scripts/check_source.py
          if ($LASTEXITCODE -ne 0) { throw 'Source checks failed' }
          python scripts/build_windows.py --godot "$env:DP_GODOT" --cc "$env:DP_CC" --templates "$env:DP_TEMPLATES" --installer
          if ($LASTEXITCODE -ne 0) { throw 'Build failed' }
      - name: Run packaging and source/pack regressions
        shell: pwsh
        env:
          DP_GODOT: ${{ inputs.godot }}
        run: |
          python scripts/run_tests.py --godot "$env:DP_GODOT"
          if ($LASTEXITCODE -ne 0) { throw 'Regression checks failed' }
      - name: Retain unsigned review artifacts
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: DesktopPet-Windows-unsigned-review
          path: |
            dist/*/DesktopPet_Setup.exe
            dist/*/DesktopPet_Portable.zip
            .build/build_result.json
            .build/logs/*.log
          if-no-files-found: error
          retention-days: 7
